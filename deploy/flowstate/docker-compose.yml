services:
  flowstate:
    image: flowstate-backend:latest
    restart: unless-stopped
    read_only: true
    environment:
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
      FLOWSTATE_AUTH_SECRET: ${FLOWSTATE_AUTH_SECRET:?required}
      FLOWSTATE_AUTH_CSRF_KEY: ${FLOWSTATE_AUTH_CSRF_KEY:?required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./config:/config/flowstate:ro
      - flowstate-data:/data
    tmpfs: [/tmp]
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]

  gateway:
    build:
      context: ../..
      dockerfile: runtime/gateway/Dockerfile
    restart: unless-stopped
    read_only: true
    environment:
      FLOWSTATE_BASE_URL: http://flowstate:8080
      FLOWSTATE_ALLOWED_ORIGIN: http://127.0.0.1:5173
      FLOWSTATE_AUTH_SECRET: ${FLOWSTATE_AUTH_SECRET:?required}
      AKILII_FLOWSTATE_TOKEN: ${AKILII_FLOWSTATE_TOKEN:?required}
    depends_on: [flowstate]
    tmpfs: [/tmp]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      FLOWSTATE_PUBLIC_HOST: ${FLOWSTATE_PUBLIC_HOST:?required}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [gateway]

  ollama:
    image: ollama/ollama:0.33.1
    profiles: ["local-models"]
    restart: unless-stopped
    volumes: ["ollama-models:/root/.ollama"]

volumes:
  flowstate-data:
  caddy-data:
  caddy-config:
  ollama-models:
